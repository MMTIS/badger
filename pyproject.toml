[project]
name = "badger"
version = "0.1.0"
description = "A fast Python based timetable converter"
authors = [ { name =    "Stefan de Konink", email = "stefan@konink.de" } ]
dependencies = [
    "chardet",
    "cloudpickle",
    "dateutils",
    "duckdb",
    "isal",
    "libmdbx>=0.3.2",
    "lmdb",
    "lz4",
    "openpyxl",
    "numpy",
    "pandas",
    "pyproj",
    "pyside6",
    "pymbtiles",
    "mapbox_vector_tile",
    "shiboken6",
    "shapely",
    "folium",
    "paramiko",
    "types-paramiko",
    "tqdm",
    "xsdata[cli,soap,lxml]==26.2",
    "pandas-stubs~=2.3.3",
    "cryptography>=50.0.0",
]
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
badger-script-runner = "tools.script_runner:cli"
badger-gtfs-viewer = "tools.gtfs_map_visualisation:cli"
badger-gui = "gui.main:main"

# Only package the specified packages
[tool.setuptools.packages.find]
include = ["conv*", "tools*", "utils*"]

[dependency-groups]
dev = [
    "ty",
    "black",
    "ruff",
]

[tool.black]
extend-exclude = "domain/netex/model/*.py"
preview = true
line-length = 160
skip-string-normalization = true

[tool.ty.src]
exclude = ["domain/netex/model/*.py"]

[tool.ruff]
exclude = ["domain/netex/model/*.py"]

[tool.ruff.lint]
extend-select = ["B"]

[[tool.mypy.overrides]]
module = ["domain.netex.model.*"]
ignore_errors = true
